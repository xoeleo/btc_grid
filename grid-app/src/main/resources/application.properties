grid.category=linear
grid.symbol=SOLUSDT
grid.entry-direction=long_only
grid.base-grid-spacing=0.001
grid.grid-requote-shrink-factor=0.85
grid.base-grid-qty=0.5
grid.max-initial-steps=5
grid.max-order-qty=5
grid.max-inventory-qty=50
grid.max-directional-inventory-qty=50
grid.max-consecutive-same-side-fills=4
grid.ema-length-4h=20
grid.boll-length-4h=20
grid.boll-std-dev-multiplier=2.0
grid.deinventory-pnl-threshold-rate=0.01
grid.deinventory-boost-slope=10
grid.deinventory-boost-cap=0.30
grid.profitable-reduce-side-multiplier=1.10
grid.classic-reduce-sizing=true
grid.pair-order-timeout-minutes=15
grid.trigger-cooldown-minutes=5
bybit.demo=false
bybit.testnet=false
bybit.public-market-mainnet=false
bybit.debug-mode=false
bybit.recv-window=60000
bybit.api-key=
bybit.api-secret=
runtime.market-poll-seconds=15
runtime.auto-start-live=false
# Runtime files are isolated by Bybit environment. With these legacy defaults,
# the app resolves paths to runtime/demo, runtime/testnet, or runtime/mainnet.
# Custom paths may include {env}, for example runtime/{env}/grid-state.json.
runtime.state-file=runtime/grid-state.json
runtime.log-file=runtime/grid-events.log
runtime.status-file=runtime/grid-status.json
runtime.fills-db=runtime/grid-fills.sqlite
runtime.http-enabled=true
runtime.http-port=8787
runtime.reconnect-base-delay-seconds=5
runtime.reconnect-max-attempts=20

# Optional BTC asset-ratio rebalancer. Disabled by default so the existing grid
# strategy behavior is unchanged unless explicitly enabled.
rebalance.enabled=false
rebalance.mode=price_target
# AUTO_CYCLE starts only while idle and total account equity converted at the
# current BTC price is strictly greater than this BTC amount.
rebalance.auto-min-total-btc=7
rebalance.auto-base-grid-qty=0.005
rebalance.auto-initial-steps=5
rebalance.category=linear
rebalance.symbol=BTCUSDT
rebalance.account-type=UNIFIED
rebalance.base-coin=BTC
rebalance.quote-coin=USDT
# Comma-separated price floor to target BTC equity ratio. The highest floor at
# or below the current BTC price is selected, for example:
# rebalance.price-targets=0:0.70,80000:0.60,100000:0.50,120000:0.40
rebalance.price-targets=0:0
rebalance.ratio-threshold=0.01
rebalance.base-grid-spacing=0.0016
rebalance.base-grid-qty=0.001
rebalance.max-initial-steps=5
rebalance.max-order-qty=0.001
rebalance.max-inventory-qty=0.15
rebalance.price-offset-ratio=0.001
rebalance.band-hysteresis-ratio=0.001
rebalance.order-ttl-minutes=15
rebalance.confirmation-samples=3
rebalance.state-file=runtime/rebalance-state.json
